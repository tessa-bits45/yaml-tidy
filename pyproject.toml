[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yamlfmt"
version = "0.1.0"
description = "Normalizes messy YAML config files into a consistent style."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "tessa-bits45"}]

[project.scripts]
yamlfmt = "yamlfmt.cli:main"
